name: Deploy frontend with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker compose --env-file .env.example build
          docker save crypto-ui:latest --output crypto-ui-image.tar
          chmod 644 crypto-ui-image.tar
          test -r crypto-ui-image.tar

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "crypto-ui-image.tar"
          target: "/tmp/"
          overwrite: true

      - name: Start container on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            docker load --input /tmp/crypto-ui-image.tar
            docker rm --force crypto-ui || true
            docker run --detach --name crypto-ui --restart unless-stopped --publish 8070:80 crypto-ui:latest
            rm --force /tmp/crypto-ui-image.tar