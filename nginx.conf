server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chrome DevTools probes this URL. Letting it fall through to the SPA returns
    # index.html with a 200 response and produces a JSON parsing error in DevTools.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        default_type application/json;
        return 200 '{}';
    }

    # HTML, the service worker and branding files must be revalidated after a
    # deployment. Hashed JS/CSS assets can still use nginx's normal caching.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location ~* ^/(?:manifest\.webmanifest|favicon(?:-\d+x\d+)?\.(?:png|ico)|coinscope-icon(?:-\d+)?\.(?:svg|png))$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
