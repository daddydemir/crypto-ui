server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chrome DevTools probes this URL. Letting it fall through to the SPA returns
    # index.html with a 200 response and produces a JSON parsing error in DevTools.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        default_type application/json;
        return 200 '{}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
